<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tga-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TGA Ballot - The Game Awards Voting</title>
    <meta name="description" content="Participa en la porra de The Game Awards. Vota una única vez y comparte tus predicciones." />
    <meta name="theme-color" content="#d8cfbb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Script bloqueante para prevenir Layout Thrashing -->
    <!-- Establece el tema ANTES de que React renderice, evitando FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('appTheme');
        const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        const themeColor = theme === 'dark' ? '#0d121a' : '#d8cfbb';
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', themeColor);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
