<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El reto del jugador</title>
    <meta name="description" content="Participa en El reto del jugador. Vota categoría a categoría y compite por el primer puesto." />
    <meta name="theme-color" content="#d8cfbb" />

    <!-- Previsualización al compartir el enlace (Open Graph + Twitter Cards).
         Sin esto, pegar la URL en WhatsApp, Slack o X mostraba solo el enlace
         pelado, sin título ni imagen.

         La tarjeta es JPEG, NO el SVG: ninguna de esas plataformas rasteriza
         SVG en `og:image`, así que apuntar al .svg equivale a no tener imagen.
         La fuente editable es `public/share-card.svg` y el JPEG se regenera con
         `npm run share-card`.

         Las URLs son ABSOLUTAS a propósito: los scrapers no resuelven rutas
         relativas, porque leen el HTML fuera del contexto de la página. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gameawards.pages.dev/" />
    <meta property="og:site_name" content="El reto del jugador" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="El reto del jugador" />
    <meta property="og:description" content="Vota categoría a categoría, compara tus aciertos y pelea por el primer puesto." />
    <meta property="og:image" content="https://gameawards.pages.dev/share-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="El reto del jugador" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="El reto del jugador" />
    <meta name="twitter:description" content="Vota categoría a categoría, compara tus aciertos y pelea por el primer puesto." />
    <meta name="twitter:image" content="https://gameawards.pages.dev/share-card.jpg" />
    <meta name="twitter:image:alt" content="El reto del jugador" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Script bloqueante para prevenir Layout Thrashing -->
    <!-- Establece el tema ANTES de que React renderice, evitando FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('appTheme');
        const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        const themeColor = theme === 'dark' ? '#0d121a' : '#d8cfbb';
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', themeColor);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
